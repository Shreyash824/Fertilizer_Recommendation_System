<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fertilizer Recommendation System</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">&#127807;</span>
      <div>
        <h1 data-i18n="appTitle">Fertilizer Recommendation System</h1>
        <p data-i18n="appSubtitle">AI-powered fertilizer selection based on soil &amp; crop analysis</p>
      </div>
    </div>
    <div class="lang-switch">
      <label for="lang-select">&#127760;</label>
      <select id="lang-select">
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
        <option value="mr">मराठी</option>
      </select>
    </div>
  </header>

  <main class="layout">
    <section class="card form-card">
      <h2 data-i18n="formTitle">Soil &amp; Crop Inputs</h2>
      <form id="recommend-form">
        <div class="grid">
          <div class="field">
            <label for="crop_type" data-i18n="cropType">Crop Type</label>
            <select id="crop_type" name="crop_type" required></select>
          </div>
          <div class="field">
            <label for="soil_type" data-i18n="soilType">Soil Type</label>
            <select id="soil_type" name="soil_type" required></select>
          </div>
          <div class="field">
            <label for="soil_color" data-i18n="soilColor">Soil Colour</label>
            <select id="soil_color" name="soil_color">
              <option value="" selected data-i18n="selectColor">Select soil colour</option>
            </select>
          </div>
          <div class="field">
            <label for="temperature" data-i18n="temperature">Temperature (°C)</label>
            <input type="number" id="temperature" name="temperature" min="0" max="60" step="0.1" required />
          </div>
          <div class="field">
            <label for="land_area" data-i18n="landArea">Farm land (acres)</label>
            <input type="number" id="land_area" name="land_area" min="0.1" max="1000" step="0.1" value="1" required />
          </div>
          <div class="field">
            <label for="crop_stage" data-i18n="cropStage">Crop stage</label>
            <select id="crop_stage" name="crop_stage" required>
              <option value="" disabled selected data-i18n="selectStage">Select crop stage</option>
              <option value="vegetative" data-i18n="stageVegetative">Vegetative</option>
              <option value="flowering" data-i18n="stageFlowering">Flowering</option>
              <option value="fruiting" data-i18n="stageFruiting">Fruiting</option>
              <option value="maturity" data-i18n="stageMaturity">Maturity</option>
            </select>
          </div>
        </div>
        <button type="submit" id="recommend-btn" data-i18n="submitBtn">Get Fertilizer Recommendation</button>
      </form>
    </section>

    <section class="card result-card">
      <h2 data-i18n="resultTitle">Recommendation</h2>
      <div id="result" class="placeholder">
        Fill the form and click the button to get your recommendation.
      </div>
    </section>
  </main>

  <footer>
    <p data-i18n="footer">ML model: Random Forest · Dataset: rule-generated agronomy data (N-P-K deficit matching)</p>
  </footer>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modal-title"></h3>
        <button id="modal-close" class="modal-close" aria-label="Close">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="/static/i18n.js"></script>
  <script src="/static/script.js"></script>
  <script>initLangSwitcher();</script>
</body>
</html>
